<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mushin</title>
  <!-- Generated SVG Tab Logo (Favicon) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='system-ui, sans-serif' font-size='48' font-weight='300' fill='%23e5e5e5'>m.</text></svg>" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-200 antialiased selection:bg-neutral-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- QUOTES DATASET ---
    const SOURCE_CATEGORIES = [
      { id: 'frankl', label: 'Viktor Frankl' },
      { id: 'stoicism', label: 'Stoicism (Marcus Aurelius & Epictetus)' },
      { id: 'buddhism', label: 'Buddhism (The Buddha)' },
      { id: 'musashi', label: 'Miyamoto Musashi' },
      { id: 'bruce_lee', label: 'Bruce Lee' },
      { id: 'taoism', label: 'Taoism (Lao Tzu)' },
      { id: 'bible', label: 'The Bible (Proverbs & Wisdom)' },
      { id: 'anime', label: 'Anime & Manga Philosophy' },
    ];

    const QUOTES = [
      { category: 'frankl', text: "Everything can be taken from a man but one thing: the last of the human freedoms—to choose one’s attitude in any given set of circumstances, to choose one’s own way.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "mushin" },
      { category: 'frankl', text: "When we are no longer able to change a situation, we are challenged to change ourselves.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "aversion" },
      { category: 'frankl', text: "Those who have a ‘why’ to live, can bear with almost any ‘how.’", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "mushin" },
      { category: 'frankl', text: "In some way, suffering ceases to be suffering at the moment it finds a meaning.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "aversion" },
      { category: 'frankl', text: "Ultimately, man should not ask what the meaning of his life is, but rather must recognize that it is he who is asked.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "mushin" },
      { category: 'frankl', text: "The way in which a man accepts his fate and all the suffering it entails... gives him ample opportunity to add a deeper meaning to his life.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "aversion" },
      { category: 'frankl', text: "The more one forgets himself—by giving himself to a cause to serve or another person to love—the more human he is.", author: "Viktor Frankl", source: "Man’s Search for Meaning", tag: "mushin" },

      { category: 'stoicism', text: "Some things are in our control and others not. Things in our control are opinion, pursuit, desire, aversion, and, in a word, whatever are our own actions.", author: "Epictetus", source: "Enchiridion", tag: "aversion" },
      { category: 'stoicism', text: "If thou art pained by any external thing, it is not this thing that disturbs thee, but thy own judgment about it.", author: "Marcus Aurelius", source: "Meditations 8.47", tag: "aversion" },
      { category: 'stoicism', text: "The things in our control are by nature free, unrestrained, unhindered; but those not in our control are weak, slavish, restrained.", author: "Epictetus", source: "Enchiridion", tag: "attachment" },
      { category: 'stoicism', text: "Remove the judgement, and you have removed the thought ‘I am hurt’: remove the thought ‘I am hurt’, and the hurt itself is removed.", author: "Marcus Aurelius", source: "Meditations", tag: "aversion" },
      { category: 'stoicism', text: "The universe is change; our life is what our thoughts make it.", author: "Marcus Aurelius", source: "Meditations 4.3", tag: "mushin" },
      { category: 'stoicism', text: "Confine yourself to the present.", author: "Marcus Aurelius", source: "Meditations", tag: "mushin" },
      { category: 'stoicism', text: "Make it your study at the very outset to say to every harsh external impression, ‘You are an external impression and not at all what you appear to be.’", author: "Epictetus", source: "Enchiridion", tag: "ignorance" },

      { category: 'bruce_lee', text: "Empty your mind, be formless, shapeless, like water. If you put water into a cup, it becomes the cup. You put water into a bottle and it becomes the bottle. Now, water can flow or it can crash. Be water, my friend.", author: "Bruce Lee", source: "Pierre Berton Interview", tag: "mushin" },
      { category: 'bruce_lee', text: "Be like water making its way through cracks. Do not be assertive, but adjust to the object, and you shall find a way round or through it.", author: "Bruce Lee", source: "Tao of Jeet Kune Do", tag: "mushin" },
      { category: 'bruce_lee', text: "In order to taste my cup of water you must first empty your cup. Drop all your preconceived and fixed ideas and be neutral.", author: "Bruce Lee", source: "Tao of Jeet Kune Do", tag: "ignorance" },
      { category: 'bruce_lee', text: "The knowledge and skills you have achieved are meant to be forgotten so you can float comfortably in emptiness, without obstruction.", author: "Bruce Lee", source: "Tao of Jeet Kune Do", tag: "mushin" },

      { category: 'musashi', text: "Accept everything just the way it is.", author: "Miyamoto Musashi", source: "Dokkōdō", tag: "attachment" },
      { category: 'musashi', text: "Think lightly of yourself and deeply of the world.", author: "Miyamoto Musashi", source: "Dokkōdō", tag: "ignorance" },
      { category: 'musashi', text: "Do nothing that is of no use.", author: "Miyamoto Musashi", source: "The Book of Five Rings", tag: "mushin" },
      { category: 'musashi', text: "Today is victory over yourself of yesterday; tomorrow is your victory over lesser men.", author: "Miyamoto Musashi", source: "The Book of Five Rings", tag: "mushin" },
      { category: 'musashi', text: "In all things have no preferences.", author: "Miyamoto Musashi", source: "Dokkōdō", tag: "attachment" },
      { category: 'musashi', text: "Both in fighting and in everyday life you should be determined through calm.", author: "Miyamoto Musashi", source: "The Book of Five Rings", tag: "mushin" },
      { category: 'musashi', text: "Perceive those things which cannot be seen.", author: "Miyamoto Musashi", source: "The Book of Five Rings", tag: "mushin" },

      { category: 'buddhism', text: "Mind precedes all mental states. Mind is their chief; they are all mind-wrought.", author: "The Buddha", source: "Dhammapada 1-2", tag: "mushin" },
      { category: 'buddhism', text: "Hatred is never appeased by hatred in this world. By non-hatred alone is hatred appeased. This is a law eternal.", author: "The Buddha", source: "Dhammapada 5", tag: "aversion" },
      { category: 'buddhism', text: "Just as a fletcher straightens an arrow shaft, even so the discerning man straightens his mind—so fickle and unsteady.", author: "The Buddha", source: "Dhammapada 33", tag: "mushin" },
      { category: 'buddhism', text: "A wise man should guard his mind for it is very hard to keep track of, extremely subtle, and follows its own desires.", author: "The Buddha", source: "Dhammapada 36", tag: "mushin" },
      { category: 'buddhism', text: "One should give up anger, renounce pride, and overcome all fetters. Suffering never befalls him who clings not to mind and body.", author: "The Buddha", source: "Dhammapada 221", tag: "aversion" },

      { category: 'taoism', text: "Nothing is weaker than water, But when it attacks something hard Or resistant, then nothing withstands it.", author: "Lao Tzu", source: "Tao Te Ching", tag: "mushin" },
      { category: 'taoism', text: "Things arise and she lets them come; Things disappear and she lets them go. She has but doesn’t possess, Acts but doesn’t expect.", author: "Lao Tzu", source: "Tao Te Ching", tag: "attachment" },
      { category: 'taoism', text: "The Master sees things as they are, Without trying to control them.", author: "Lao Tzu", source: "Tao Te Ching", tag: "attachment" },

      { category: 'bible', text: "He who is slow to anger is better than the mighty, and he who rules his spirit than he who takes a city.", author: "Solomon", source: "Proverbs 16:32", tag: "aversion" },
      { category: 'bible', text: "A soft answer turns away wrath, but a harsh word stirs up anger.", author: "Solomon", source: "Proverbs 15:1", tag: "aversion" },
      { category: 'bible', text: "Keep your heart with all vigilance, for from it flow the springs of life.", author: "Solomon", source: "Proverbs 4:23", tag: "mushin" },
      { category: 'bible', text: "For everything there is a season, and a time for every matter under heaven.", author: "Solomon", source: "Ecclesiastes 3:1", tag: "attachment" },
      { category: 'bible', text: "Like a city broken into and left without walls is a man who lacks self-control.", author: "Solomon", source: "Proverbs 25:28", tag: "mushin" },

      { category: 'anime', text: "Preoccupied with a single leaf, you won't see the tree. Preoccupied with a single tree, you'll miss the entire forest.", author: "Takuan Sōhō", source: "Vagabond", tag: "ignorance" },
      { category: 'anime', text: "The past is the past. We cannot rewrite it, nor can we undo it. But we can choose how to react in this moment.", author: "Kenshin Himura", source: "Rurouni Kenshin", tag: "mushin" },
      { category: 'anime', text: "In the depth of winter, I finally learned that within me there lay an invincible summer. Do not let your anger govern your blade.", author: "Miyamoto Musashi", source: "Vagabond (Takehiko Inoue)", tag: "aversion" },
      { category: 'anime', text: "Pride is not the opposite of shame, but its source. True humility is the only antidote to fear.", author: "Uncle Iroh", source: "Avatar: The Last Airbender", tag: "attachment" },
      { category: 'anime', text: "If you don't like your destiny, don't accept it. Instead, have the courage to change it the way you want it to be.", author: "Naruto Uzumaki", source: "Naruto", tag: "mushin" }
    ];

    // --- ICONS ---
    const Icons = {
      Attachment: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      ),
      Aversion: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
        </svg>
      ),
      Ignorance: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 12a10 10 0 1 0 20 0 10 10 0 1 0-20 0"/>
          <path d="M12 8v4l3 3"/>
        </svg>
      ),
      History: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-5 5"/>
        </svg>
      ),
      Settings: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      ),
      ArrowLeft: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
      ),
      Help: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      ),
      Trash: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      ),
      Close: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      )
    };

    // --- MAIN APPLICATION ---
    function App() {
      const [view, setView] = useState('splash');
      const [activePulse, setActivePulse] = useState(null);
      const [confirmState, setConfirmState] = useState(0);
      const [isViewingLogs, setIsViewingLogs] = useState(false);

      const [hasSeenTutorial, setHasSeenTutorial] = useState(() => {
        return localStorage.getItem('mushin_tutorial') === 'true';
      });

      const [enabledSources, setEnabledSources] = useState(() => {
        const saved = localStorage.getItem('mushin_enabled_sources');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return SOURCE_CATEGORIES.map(s => s.id);
      });

      const [todayLogs, setTodayLogs] = useState(() => {
        const saved = localStorage.getItem('mushin_today');
        if (saved) {
          try {
            return JSON.parse(saved).map(log => ({ ...log, timestamp: new Date(log.timestamp) }));
          } catch (e) { return []; }
        }
        return [];
      });

      const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('mushin_history');
        if (saved) {
          try {
            return JSON.parse(saved).map(day => ({
              ...day, 
              date: new Date(day.date),
              logs: day.logs.map(log => ({ ...log, timestamp: new Date(log.timestamp) }))
            }));
          } catch (e) { return []; }
        }
        return [];
      });

      useEffect(() => {
        localStorage.setItem('mushin_today', JSON.stringify(todayLogs));
      }, [todayLogs]);

      useEffect(() => {
        localStorage.setItem('mushin_history', JSON.stringify(history));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('mushin_enabled_sources', JSON.stringify(enabledSources));
      }, [enabledSources]);

      const handleLog = (type, e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const severity = Math.max(0.1, Math.min(1, x / rect.width));

        const newLog = { id: Date.now(), type, severity, timestamp: new Date() };
        setTodayLogs([...todayLogs, newLog]);
        
        setActivePulse({ type, x, y: e.clientY - rect.top });
        setTimeout(() => setActivePulse(null), 700); 
        setConfirmState(0);
      };

      const calculateScore = (logs) => {
        const count = logs.length;
        if (count === 0) return 5;

        let energy = 100;
        logs.forEach(log => {
          const severity = log.severity || 0.5;
          energy -= (5 + severity * 15);
        });

        if (count > 1) {
          for (let i = 1; i < count; i++) {
            const gapMs = logs[i].timestamp - logs[i - 1].timestamp;
            const gapMinutes = gapMs / (1000 * 60);

            if (gapMinutes < 15) energy -= 15;
            else if (gapMinutes < 60) energy -= 8;
            else if (gapMinutes > 180) energy += 5;
          }
        }

        if (energy >= 80) return 5;
        if (energy >= 60) return 4;
        if (energy >= 40) return 3;
        if (energy >= 20) return 2;
        return 1;
      };

      const handleSaveDay = (note = '') => {
        const daySummary = {
          id: Date.now(),
          date: new Date(),
          logs: todayLogs,
          rating: calculateScore(todayLogs),
          note: note.trim()
        };
        setHistory([daySummary, ...history]);
        setTodayLogs([]);
        setConfirmState(0);
        setView('history');
      };

      const handleDeleteDay = (dayId) => {
        setHistory(history.filter(day => day.id !== dayId));
      };

      const toggleSourceCategory = (id) => {
        if (enabledSources.includes(id)) {
          if (enabledSources.length === 1) return;
          setEnabledSources(enabledSources.filter(s => s !== id));
        } else {
          setEnabledSources([...enabledSources, id]);
        }
      };

      if (view === 'splash') {
        return <SplashScreen onComplete={() => setView(hasSeenTutorial ? 'dashboard' : 'tutorial')} />;
      }

      if (view === 'tutorial') {
        return (
          <TutorialScreen 
            onComplete={() => {
              localStorage.setItem('mushin_tutorial', 'true');
              setHasSeenTutorial(true);
              setView('dashboard');
            }} 
          />
        );
      }

      if (view === 'faq') {
        return <FaqScreen onBack={() => setView('dashboard')} onOpenTutorial={() => setView('tutorial')} />;
      }

      if (view === 'settings') {
        return (
          <SettingsScreen 
            onBack={() => setView('dashboard')} 
            enabledSources={enabledSources}
            onToggleSource={toggleSourceCategory}
          />
        );
      }

      if (view === 'dashboard') {
        return (
          <div className="min-h-screen bg-neutral-950 text-neutral-200 p-6 flex flex-col font-sans lowercase animate-in fade-in duration-500 relative">
            <style>{`
              @keyframes ripple-burst {
                0% { transform: scale(0) translate(-50%, -50%); opacity: 0.8; }
                100% { transform: scale(30) translate(-50%, -50%); opacity: 0; }
              }
              .custom-ripple {
                position: absolute;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.25);
                animation: ripple-burst 0.7s ease-out forwards;
                pointer-events: none;
                transform-origin: 0 0;
              }
            `}</style>
            
            <div className="flex justify-between items-center mb-8 pt-4">
              <h1 className="text-xl font-light tracking-wide text-neutral-400">mushin</h1>
              <div className="flex gap-4 items-center">
                <button onClick={() => setView('settings')} className="text-neutral-500 hover:text-neutral-300 transition-colors" title="Settings">
                  <Icons.Settings />
                </button>
                <button onClick={() => setView('faq')} className="text-neutral-500 hover:text-neutral-300 transition-colors" title="FAQ">
                  <Icons.Help />
                </button>
                <button onClick={() => setView('history')} className="text-neutral-500 hover:text-neutral-300 transition-colors flex items-center gap-1 text-sm">
                  <Icons.History /> history
                </button>
              </div>
            </div>

            <div className="flex-1 flex flex-col gap-4 justify-center max-w-md mx-auto w-full">
              <button
                onMouseDown={(e) => handleLog('attachment', e)}
                className={`relative flex flex-col items-center justify-center p-8 rounded-3xl border border-teal-900/30 bg-teal-950/20 text-teal-200/70 transition-all duration-300 overflow-hidden
                  ${activePulse?.type === 'attachment' ? 'scale-95 bg-teal-900/40 border-teal-700/50 text-teal-100' : 'hover:bg-teal-950/40 hover:border-teal-800/50 hover:text-teal-200'}`}
              >
                {activePulse?.type === 'attachment' && (
                  <span className="custom-ripple" style={{ left: activePulse.x, top: activePulse.y }} />
                )}
                <Icons.Attachment />
                <span className="mt-4 font-medium tracking-wide relative z-10 pointer-events-none">attachment</span>
                <span className="text-xs text-teal-500/50 mt-2 font-light relative z-10 pointer-events-none">clinging • greed • rigidity</span>
              </button>

              <button
                onMouseDown={(e) => handleLog('aversion', e)}
                className={`relative flex flex-col items-center justify-center p-8 rounded-3xl border border-rose-900/30 bg-rose-950/20 text-rose-200/70 transition-all duration-300 overflow-hidden
                  ${activePulse?.type === 'aversion' ? 'scale-95 bg-rose-900/40 border-rose-700/50 text-rose-100' : 'hover:bg-rose-950/40 hover:border-rose-800/50 hover:text-rose-200'}`}
              >
                {activePulse?.type === 'aversion' && (
                  <span className="custom-ripple" style={{ left: activePulse.x, top: activePulse.y }} />
                )}
                <Icons.Aversion />
                <span className="mt-4 font-medium tracking-wide relative z-10 pointer-events-none">aversion</span>
                <span className="text-xs text-rose-500/50 mt-2 font-light relative z-10 pointer-events-none">anger • hatred • resistance</span>
              </button>

              <button
                onMouseDown={(e) => handleLog('ignorance', e)}
                className={`relative flex flex-col items-center justify-center p-8 rounded-3xl border border-indigo-900/30 bg-indigo-950/20 text-indigo-200/70 transition-all duration-300 overflow-hidden
                  ${activePulse?.type === 'ignorance' ? 'scale-95 bg-indigo-900/40 border-indigo-700/50 text-indigo-100' : 'hover:bg-indigo-950/40 hover:border-indigo-800/50 hover:text-indigo-200'}`}
              >
                {activePulse?.type === 'ignorance' && (
                  <span className="custom-ripple" style={{ left: activePulse.x, top: activePulse.y }} />
                )}
                <Icons.Ignorance />
                <span className="mt-4 font-medium tracking-wide relative z-10 pointer-events-none">ignorance</span>
                <span className="text-xs text-indigo-500/50 mt-2 font-light relative z-10 pointer-events-none">delusion • autopilot • assumptions</span>
              </button>
            </div>

            <div className="mt-8 pb-6 flex flex-col items-center justify-center gap-4">
              {confirmState === 2 ? (
                <div className="flex gap-4">
                  <button onClick={() => setConfirmState(0)} className="px-6 py-4 rounded-full text-sm font-medium tracking-widest text-neutral-500 hover:text-neutral-300 transition-all">
                    cancel
                  </button>
                  <button onClick={() => setView('endDay')} className="px-8 py-4 rounded-full text-sm font-medium tracking-widest bg-gradient-to-r from-pink-100 via-purple-200 to-white text-purple-950 hover:opacity-90 shadow-[0_0_20px_rgba(244,211,238,0.4)] transition-all">
                    confirm 0 logs
                  </button>
                </div>
              ) : confirmState === 1 ? (
                <div className="flex gap-4">
                  <button onClick={() => setConfirmState(0)} className="px-6 py-4 rounded-full text-sm font-medium tracking-widest text-neutral-500 hover:text-neutral-300 transition-all">
                    cancel
                  </button>
                  <button onClick={() => { if (todayLogs.length === 0) setConfirmState(2); else setView('endDay'); }} className="px-8 py-4 rounded-full text-sm font-medium tracking-widest bg-neutral-200 text-neutral-900 hover:bg-white shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all">
                    confirm end
                  </button>
                </div>
              ) : (
                <div className="flex flex-col items-center gap-3 w-full">
                  <button onClick={() => setConfirmState(1)} className="px-8 py-4 rounded-full text-sm font-medium tracking-widest transition-all duration-300 bg-neutral-800 text-neutral-300 hover:bg-neutral-700 hover:text-white shadow-lg w-auto">
                    end day ({todayLogs.length} logs)
                  </button>
                  <button 
                    onClick={() => setIsViewingLogs(true)} 
                    className="text-xs text-neutral-500 hover:text-neutral-300 transition-colors"
                  >
                    view today's logs
                  </button>
                </div>
              )}
            </div>

            {/* View Today Logs Overlay */}
            {isViewingLogs && (
              <div className="absolute inset-0 bg-neutral-950/95 backdrop-blur-sm z-50 flex flex-col p-6 animate-in fade-in duration-200">
                <div className="flex justify-between items-center mb-8 pt-4 max-w-md mx-auto w-full">
                  <h2 className="text-xl font-light text-neutral-200">today's logs</h2>
                  <button onClick={() => setIsViewingLogs(false)} className="text-neutral-500 hover:text-white p-2">
                    <Icons.Close />
                  </button>
                </div>
                
                <div className="flex-1 max-w-md mx-auto w-full overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-neutral-800 space-y-3">
                  {todayLogs.length === 0 ? (
                    <p className="text-neutral-500 text-sm font-light text-center mt-10">no logs yet today.</p>
                  ) : (
                    todayLogs.map(log => (
                      <div key={log.id} className="flex justify-between items-center bg-neutral-900/50 p-4 rounded-xl border border-neutral-800/50">
                        <div>
                          <div className="flex items-center gap-2 mb-1">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-medium 
                              ${log.type === 'attachment' ? 'bg-teal-950/50 text-teal-300 border border-teal-900/50' : 
                                log.type === 'aversion' ? 'bg-rose-950/50 text-rose-300 border border-rose-900/50' : 
                                'bg-indigo-950/50 text-indigo-300 border border-indigo-900/50'}`}>
                              {log.type}
                            </span>
                            <span className="text-xs text-neutral-500">
                              {log.timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </span>
                          </div>
                          {log.severity && (
                            <div className="text-[10px] text-neutral-600 mt-1">
                              severity: {(log.severity * 100).toFixed(0)}%
                            </div>
                          )}
                        </div>
                        <button 
                          onClick={() => setTodayLogs(todayLogs.filter(l => l.id !== log.id))}
                          className="text-neutral-600 hover:text-rose-400 p-2 transition-colors"
                          title="delete log"
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (view === 'endDay') {
        return <EndDayScreen logs={todayLogs} score={calculateScore(todayLogs)} enabledSources={enabledSources} onSave={handleSaveDay} onCancel={() => { setConfirmState(0); setView('dashboard'); }} />;
      }

      if (view === 'history') {
        return <HistoryScreen history={history} onBack={() => setView('dashboard')} onDeleteDay={handleDeleteDay} />;
      }

      return null;
    }

    // --- SETTINGS SCREEN SUB-COMPONENT WITH EXPORT & IMPORT & RESET ---
    function SettingsScreen({ onBack, enabledSources, onToggleSource }) {
      const [exportText, setExportText] = useState('');
      const [importInput, setImportInput] = useState('');
      const [copied, setCopied] = useState(false);
      const [statusMsg, setStatusMsg] = useState(null);
      const [confirmReset, setConfirmReset] = useState(false);

      const handleGenerateExport = () => {
        const payload = {
          version: 1,
          timestamp: new Date().toISOString(),
          mushin_today: localStorage.getItem('mushin_today'),
          mushin_history: localStorage.getItem('mushin_history'),
          mushin_enabled_sources: localStorage.getItem('mushin_enabled_sources'),
          mushin_tutorial: localStorage.getItem('mushin_tutorial'),
        };
        const text = JSON.stringify(payload, null, 2);
        setExportText(text);
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

      const handleImportData = () => {
        try {
          if (!importInput.trim()) return;
          const data = JSON.parse(importInput);
          
          if (data.mushin_today) localStorage.setItem('mushin_today', data.mushin_today);
          if (data.mushin_history) localStorage.setItem('mushin_history', data.mushin_history);
          if (data.mushin_enabled_sources) localStorage.setItem('mushin_enabled_sources', data.mushin_enabled_sources);
          if (data.mushin_tutorial) localStorage.setItem('mushin_tutorial', data.mushin_tutorial);

          setStatusMsg({ type: 'success', text: 'data imported successfully! reloading...' });
          setTimeout(() => window.location.reload(), 1500);
        } catch (e) {
          setStatusMsg({ type: 'error', text: 'invalid data format. check and try again.' });
        }
      };

      const handleFullReset = () => {
        localStorage.clear();
        window.location.reload();
      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-200 p-6 flex flex-col font-sans lowercase animate-in fade-in duration-500 overflow-y-auto">
          <div className="flex items-center mb-8 pt-4">
            <button onClick={onBack} className="text-neutral-500 hover:text-neutral-300 mr-4">
              <Icons.ArrowLeft />
            </button>
            <h2 className="text-xl font-light tracking-wide text-neutral-400">settings & backup</h2>
          </div>

          <div className="flex-1 max-w-md mx-auto w-full space-y-8 pb-12">
            <div>
              <h3 className="text-sm font-medium text-white mb-2">quote sources</h3>
              <p className="text-xs text-neutral-400 font-light mb-4">
                select philosophical traditions to draw reflection quotes from.
              </p>

              <div className="space-y-3">
                {SOURCE_CATEGORIES.map(category => {
                  const isEnabled = enabledSources.includes(category.id);
                  return (
                    <button
                      key={category.id}
                      onClick={() => onToggleSource(category.id)}
                      className={`w-full p-3.5 rounded-2xl border text-left flex items-center justify-between transition-all duration-300
                        ${isEnabled 
                          ? 'bg-neutral-900/80 border-neutral-700 text-neutral-100 shadow-sm' 
                          : 'bg-neutral-950/40 border-neutral-800/40 text-neutral-600'}`}
                    >
                      <span className="text-xs font-medium">{category.label}</span>
                      <div className={`w-4 h-4 rounded-full border flex items-center justify-center transition-colors
                        ${isEnabled ? 'border-amber-300/80 bg-amber-400/20 text-amber-300' : 'border-neutral-800 bg-transparent'}`}>
                        {isEnabled && <span className="text-[10px]">✓</span>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="pt-6 border-t border-neutral-800">
              <h3 className="text-sm font-medium text-white mb-2">data backup & restore</h3>
              <p className="text-xs text-neutral-400 font-light mb-4">
                export your local data as text to save or move it to another device, or paste exported text back to import.
              </p>

              <div className="space-y-4">
                <button
                  onClick={handleGenerateExport}
                  className="w-full py-3 rounded-xl bg-neutral-900 border border-neutral-800 text-xs text-neutral-200 hover:text-white hover:border-neutral-700 transition-colors"
                >
                  {copied ? 'copied to clipboard!' : 'export data string'}
                </button>

                {exportText && (
                  <textarea
                    readOnly
                    value={exportText}
                    className="w-full h-24 p-3 rounded-xl bg-neutral-900/50 border border-neutral-800 text-[11px] font-mono text-neutral-400 resize-none"
                  />
                )}

                <div className="pt-2">
                  <textarea
                    placeholder="paste exported text string here to import..."
                    value={importInput}
                    onChange={(e) => setImportInput(e.target.value)}
                    className="w-full h-24 p-3 rounded-xl bg-neutral-900/50 border border-neutral-800 text-[11px] font-mono text-neutral-300 focus:border-neutral-600 outline-none resize-none"
                  />
                  <button
                    onClick={handleImportData}
                    className="w-full mt-2 py-3 rounded-xl bg-neutral-200 text-neutral-900 text-xs font-medium hover:bg-white transition-colors"
                  >
                    import & overwrite data
                  </button>
                </div>

                {statusMsg && (
                  <p className={`text-xs text-center ${statusMsg.type === 'success' ? 'text-teal-400' : 'text-rose-400'}`}>
                    {statusMsg.text}
                  </p>
                )}
              </div>
            </div>
            
            <div className="pt-6 border-t border-neutral-800">
              <h3 className="text-sm font-medium text-rose-400 mb-2">danger zone</h3>
              {confirmReset ? (
                <div className="bg-rose-950/20 border border-rose-900/50 p-4 rounded-xl flex flex-col gap-3">
                  <p className="text-xs text-rose-300 font-light text-center">are you absolutely sure? this deletes all logs and history forever.</p>
                  <div className="flex gap-2">
                    <button onClick={() => setConfirmReset(false)} className="flex-1 py-2.5 rounded-lg bg-neutral-900 text-neutral-300 text-xs hover:bg-neutral-800 transition-colors">cancel</button>
                    <button onClick={handleFullReset} className="flex-1 py-2.5 rounded-lg bg-rose-900/80 text-white text-xs hover:bg-rose-800 transition-colors font-medium">yes, delete everything</button>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => setConfirmReset(true)}
                  className="w-full py-3 rounded-xl bg-transparent border border-rose-900/30 text-xs text-rose-500 hover:bg-rose-950/20 hover:text-rose-400 transition-colors"
                >
                  reset all local data
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- SPLASH COMPONENT ---
    function SplashScreen({ onComplete }) {
      const [isTriggered, setIsTriggered] = useState(false);

      const petals = useMemo(() => {
        return Array.from({ length: 20 }).map((_, i) => ({
          id: i,
          left: `${(i * 5) + (Math.sin(i * 3) * 3)}%`,
          animationDuration: `${3.5 + (i % 5) * 0.8}s`,
          animationDelay: `${(i % 7) * 0.2}s`,
          rotation: (i * 37) % 360,
          size: 6 + (i % 3) * 2
        }));
      }, []);

      const handleTap = () => {
        if (isTriggered) return;
        setIsTriggered(true);
        setTimeout(() => { onComplete(); }, 4200);
      };

      return (
        <div 
          className={`relative min-h-screen w-full flex flex-col items-center justify-center overflow-hidden cursor-pointer select-none lowercase transition-colors duration-[1500ms] ease-in-out ${
            isTriggered ? 'bg-neutral-950 text-neutral-200' : 'bg-white text-neutral-800'
          }`}
          onClick={handleTap}
        >
          <style>{`
            @keyframes fluidRipple {
              0% { transform: scale(0.5); opacity: 0.8; border-width: 2px; }
              100% { transform: scale(35); opacity: 0; border-width: 0.5px; }
            }
            @keyframes fluidPetalFall {
              0% { transform: translateY(-20px) rotate(var(--rot)) translateX(0); opacity: 0; }
              15% { opacity: 0.7; }
              85% { opacity: 0.7; }
              100% { transform: translateY(110vh) rotate(calc(var(--rot) + 220deg)) translateX(30px); opacity: 0; }
            }
            @keyframes smoothDotInvert {
              0% { background-color: #171717; box-shadow: 0 0 0px rgba(0,0,0,0); }
              50% { background-color: #ffffff; box-shadow: 0 0 20px rgba(255,255,255,0.8); }
              100% { background-color: #ffffff; box-shadow: 0 0 20px rgba(255,255,255,0.8); }
            }
            @keyframes smoothDotSplitLeft {
              0% { transform: translateX(0) scale(1); }
              40% { transform: translateX(0) scale(1.2); }
              100% { transform: translateX(-42px) scale(1); }
            }
            @keyframes smoothDotSplitRight {
              0% { transform: translateX(0); opacity: 0; }
              10% { transform: translateX(0); opacity: 1; }
              100% { transform: translateX(42px); opacity: 1; }
            }
            @keyframes smoothTextFade {
              0% { opacity: 0; transform: translateY(10px); }
              50% { opacity: 0; transform: translateY(10px); }
              100% { opacity: 0.8; transform: translateY(0); }
            }
            .petal-element {
              position: absolute;
              background-color: #fbcfe8;
              border-radius: 60% 0 60% 60%;
              pointer-events: none;
              filter: blur(0.5px);
            }
          `}</style>

          {isTriggered && (
            <div className="absolute inset-0 pointer-events-none z-10 overflow-hidden">
              {petals.map(p => (
                <div 
                  key={p.id}
                  className="petal-element"
                  style={{
                    left: p.left,
                    top: '-20px',
                    width: `${p.size}px`,
                    height: `${p.size * 1.5}px`,
                    '--rot': `${p.rotation}deg`,
                    animation: `fluidPetalFall ${p.animationDuration} ease-out ${p.animationDelay} forwards`
                  }}
                />
              ))}
            </div>
          )}

          <div className="relative z-20 w-full h-32 flex items-center justify-center">
            {isTriggered && (
              <div className="absolute w-6 h-6 rounded-full border border-neutral-400 pointer-events-none animate-[fluidRipple_2s_cubic-bezier(0.1,0.8,0.3,1)_forwards]" />
            )}
            {isTriggered && (
              <div 
                className="absolute w-3.5 h-3.5 bg-amber-300 rounded-full shadow-[0_0_15px_rgba(252,211,77,0.7)]"
                style={{ animation: `smoothDotSplitRight 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards` }}
              />
            )}
            <div 
              className={`absolute w-3.5 h-3.5 rounded-full transition-colors ${!isTriggered ? 'bg-neutral-900' : ''}`}
              style={isTriggered ? {
                animation: `smoothDotInvert 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards, smoothDotSplitLeft 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards`
              } : {}}
            />
          </div>

          <div className="relative z-20 mt-8 text-center px-6">
            {!isTriggered ? (
              <p className="tracking-[0.2em] text-sm font-light text-neutral-500 animate-pulse">tap to begin</p>
            ) : (
              <div className="animate-[smoothTextFade_1.8s_ease-out_1.8s_forwards] opacity-0 flex flex-col items-center gap-2">
                <p className="text-xs text-neutral-400 font-light tracking-[0.15em] max-w-xs leading-relaxed">
                  between stimulus and response there is a space.
                </p>
                <p className="text-sm text-neutral-200 tracking-[0.25em] font-normal">
                  the space between.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- END DAY SUB-COMPONENT ---
    function EndDayScreen({ logs, score, enabledSources, onSave, onCancel }) {
      const [note, setNote] = useState('');

      const counts = logs.reduce((acc, log) => {
        acc[log.type] = (acc[log.type] || 0) + 1;
        return acc;
      }, {});
      
      let dominant = 'none';
      let maxCount = 0;
      Object.entries(counts).forEach(([type, count]) => {
        if (count > maxCount) {
          maxCount = count;
          dominant = type;
        }
      });

      const selectedQuote = useMemo(() => {
        const targetTag = (score === 5 || dominant === 'none') ? 'mushin' : dominant;
        let pool = QUOTES.filter(q => enabledSources.includes(q.category));
        if (pool.length === 0) pool = QUOTES;

        const tagFiltered = pool.filter(q => q.tag === targetTag);
        const finalPool = tagFiltered.length > 0 ? tagFiltered : pool;

        return finalPool[Math.floor(Math.random() * finalPool.length)];
      }, [dominant, score, enabledSources]);

      const isPerfect = score === 5;
      const isGreat = score === 4;

      return (
        <div className="min-h-screen text-neutral-200 p-6 flex flex-col font-sans lowercase animate-in fade-in duration-500 relative overflow-hidden bg-neutral-950">
          {isPerfect && (
            <div className="absolute inset-0 pointer-events-none opacity-25 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-pink-300/30 via-purple-500/10 to-neutral-950" />
          )}
          <button onClick={onCancel} className="text-neutral-500 hover:text-neutral-300 self-start mb-6 relative z-10">
            <Icons.ArrowLeft />
          </button>

          <div className="flex-1 max-w-md mx-auto w-full flex flex-col relative z-10 pb-8">
            <h2 className={`text-3xl font-light mb-2 ${isPerfect ? 'text-purple-100 drop-shadow-[0_0_12px_rgba(244,211,238,0.4)]' : 'text-white'}`}>
              day summary
            </h2>
            <p className="text-neutral-400 font-light mb-8">reflect on the space you created.</p>

            <div className="mb-8 p-6 rounded-2xl bg-neutral-900/40 border border-neutral-800/60 text-center relative overflow-hidden">
              <p className="text-[10px] text-neutral-500 uppercase tracking-widest mb-3 font-mono">daily reflection • {selectedQuote.tag}</p>
              <blockquote className="text-sm text-neutral-200 font-light italic leading-relaxed mb-3">
                "{selectedQuote.text}"
              </blockquote>
              <cite className="text-xs text-neutral-400 not-italic font-medium">
                — {selectedQuote.author}{selectedQuote.source ? ` (${selectedQuote.source})` : ''}
              </cite>
            </div>

            <div className={`rounded-2xl p-6 mb-6 border transition-colors duration-1000 ${isPerfect ? 'bg-purple-950/20 border-purple-800/40 shadow-[0_0_30px_rgba(216,180,254,0.08)]' : isGreat ? 'bg-yellow-950/10 border-yellow-900/30' : 'bg-neutral-900/50 border-neutral-800/50'}`}>
              <div className="grid grid-cols-2 gap-4 mb-6">
                <div>
                  <p className="text-xs text-neutral-500 tracking-wider mb-1">total logs</p>
                  <p className="text-2xl font-light">{logs.length}</p>
                </div>
                <div>
                  <p className="text-xs text-neutral-500 tracking-wider mb-1">dominant force</p>
                  <p className="text-xl font-light text-neutral-300">{dominant}</p>
                </div>
              </div>

              <div className="flex justify-between items-center mb-2">
                <p className="text-xs text-neutral-500 tracking-wider">calculated score</p>
                <div className="flex gap-1">
                  {[...Array(5)].map((_, i) => (
                    <div key={i} className={`w-2 h-2 rounded-full transition-all duration-500 
                      ${i < score 
                        ? (isPerfect ? 'bg-gradient-to-r from-pink-200 via-purple-200 to-white shadow-[0_0_8px_rgba(244,211,238,0.8)]' : isGreat ? 'bg-yellow-400 shadow-[0_0_6px_rgba(250,204,21,0.5)]' : 'bg-neutral-300') 
                        : 'bg-neutral-800'}`} 
                    />
                  ))}
                </div>
              </div>
            </div>

            <div className="mb-8 relative">
              <input 
                type="text" 
                maxLength={50}
                value={note}
                onChange={(e) => setNote(e.target.value)}
                placeholder="add a brief note (optional)..." 
                className="w-full bg-neutral-900/40 border border-neutral-800/60 rounded-xl px-4 py-3 text-sm text-neutral-200 placeholder-neutral-600 focus:outline-none focus:border-neutral-600 transition-colors"
              />
              <span className="absolute right-4 top-3 text-[10px] text-neutral-600 font-mono">
                {note.length}/50
              </span>
            </div>

            <button 
              onClick={() => onSave(note)}
              className={`w-full py-4 rounded-xl font-medium tracking-wide transition-colors mt-auto shadow-[0_0_15px_rgba(255,255,255,0.1)]
                ${isPerfect ? 'bg-gradient-to-r from-pink-100 via-purple-200 to-white text-purple-950 hover:opacity-95 shadow-[0_0_20px_rgba(244,211,238,0.3)]' : isGreat ? 'bg-yellow-200 text-yellow-950 hover:bg-yellow-100' : 'bg-neutral-200 text-neutral-900 hover:bg-white'}`}
            >
              save to archive
            </button>
          </div>
        </div>
      );
    }

    // --- HISTORY SUB-COMPONENT ---
    function HistoryScreen({ history, onBack, onDeleteDay }) {
      const recentDays = history.slice(0, 7);
      let trendContent = <p className="text-sm font-light text-neutral-300">no recent data.</p>;
      
      if (recentDays.length > 0) {
        const counts = { attachment: 0, aversion: 0, ignorance: 0 };
        let totalScore = 0;
        
        recentDays.forEach(day => {
          totalScore += day.rating;
          day.logs.forEach(log => {
            if (counts[log.type] !== undefined) counts[log.type]++;
          });
        });

        const avgScore = (totalScore / recentDays.length).toFixed(1);
        const dominant = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        
        if (counts[dominant] === 0) {
          trendContent = <p className="text-sm font-light text-neutral-300">avg score: {avgScore}/5. you have been completely clear.</p>;
        } else {
          const colorClass = dominant === 'attachment' ? 'text-teal-400' : dominant === 'aversion' ? 'text-rose-400' : 'text-indigo-400';
          trendContent = (
            <p className="text-sm font-light text-neutral-300">
              avg score: {avgScore}/5. your dominant pull recently is <span className={colorClass}>{dominant}</span>.
            </p>
          );
        }
      }

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-200 p-6 flex flex-col font-sans lowercase animate-in fade-in duration-500">
          <div className="flex items-center mb-8 pt-4">
            <button onClick={onBack} className="text-neutral-500 hover:text-neutral-300 mr-4">
              <Icons.ArrowLeft />
            </button>
            <h2 className="text-xl font-light tracking-wide text-neutral-400">your journey</h2>
          </div>

          <div className="flex-1 max-w-md mx-auto w-full flex flex-col">
            {history.length > 0 && (
              <div className="bg-neutral-900/60 border border-neutral-800 rounded-2xl p-5 mb-8">
                <p className="text-xs text-neutral-500 tracking-wider mb-2">recent trends</p>
                {trendContent}
              </div>
            )}

            {history.length === 0 ? (
              <div className="text-center text-neutral-600 mt-20 font-light">
                <p>your path is clear.</p>
                <p className="text-sm mt-2">end a day to see your history here.</p>
              </div>
            ) : (
              <div className="space-y-4 pb-12">
                {history.map((day) => (
                  <div key={day.id} className="bg-neutral-900/40 border border-neutral-800/50 p-5 rounded-2xl flex flex-col relative group">
                    <div className="flex items-start justify-between w-full">
                      <div className="pr-8">
                        <p className="font-medium text-neutral-200">
                          {day.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}
                        </p>
                        <p className="text-xs text-neutral-500 mt-1">
                          {day.logs.length} reactions logged
                        </p>
                        {day.note && (
                          <p className="text-sm text-neutral-400 mt-3 font-light italic border-l border-neutral-800 pl-3">
                            "{day.note}"
                          </p>
                        )}
                      </div>
                      
                      <div className="flex flex-col items-end">
                        <div className="flex gap-1 mb-1">
                          {[...Array(5)].map((_, i) => (
                            <div key={i} className={`w-1.5 h-1.5 rounded-full 
                              ${i < day.rating 
                                ? (day.rating === 5 ? 'bg-gradient-to-r from-pink-200 to-purple-300 shadow-[0_0_5px_rgba(244,211,238,0.8)]' : day.rating === 4 ? 'bg-yellow-400' : 'bg-neutral-400') 
                                : 'bg-neutral-800'}`} 
                            />
                          ))}
                        </div>
                        <span className="text-[10px] text-neutral-600 tracking-widest">score</span>
                      </div>
                    </div>
                    
                    <button 
                      onClick={() => { if(window.confirm('delete this day from history?')) onDeleteDay(day.id); }}
                      className="absolute bottom-4 right-4 text-neutral-600 hover:text-rose-400 transition-colors"
                      title="delete day"
                    >
                      <Icons.Trash />
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- TUTORIAL SCREEN (WITH SKIP DEMO FEATURE) ---
    function TutorialScreen({ onComplete }) {
      const [step, setStep] = useState(0); 
      const [pulsePos, setPulsePos] = useState(null);
      const [showHintPulse, setShowHintPulse] = useState(false);
      const [correctPopup, setCorrectPopup] = useState(null);
      const [showLessonOverlay, setShowLessonOverlay] = useState(false);

      const handleSkipDemo = () => {
        localStorage.setItem('mushin_tutorial', 'true');
        onComplete();
      };

      const correctPoisonForStep = useMemo(() => {
        if (step === 5) return 'attachment';
        if (step === 6) return 'aversion';
        if (step === 7) return 'ignorance';
        if (step === 9) return 'aversion';
        return null;
      }, [step]);

      const handlePoisonTap = (type, e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (step === 5) {
          if (type === 'attachment') {
            setShowHintPulse(false);
            triggerSuccessOverlay("correct!", "raging because things 'should' be home is clinging to an ideal—this is attachment.", 6);
            setPulsePos({ x, y, type });
          } else {
            setShowHintPulse(true);
          }
        } else if (step === 6) {
          if (type === 'aversion') {
            setShowHintPulse(false);
            triggerSuccessOverlay("correct!", "snapping back aggressively out of anger is aversion.", 7);
            setPulsePos({ x, y, type });
          } else {
            setShowHintPulse(true);
          }
        } else if (step === 7) {
          if (type === 'ignorance') {
            setShowHintPulse(false);
            triggerSuccessOverlay("correct!", "scrolling mindlessly on autopilot is ignorance/delusion.", 8);
            setPulsePos({ x, y, type });
          } else {
            setShowHintPulse(true);
          }
        } else if (step === 8) {
          setShowLessonOverlay(true);
        } else if (step === 9) {
          if (type === 'aversion') {
            if (x > rect.width / 2) {
              setShowHintPulse(false);
              triggerSuccessOverlay("correct!", "tapping the far right side logs high severity.", 10);
              setPulsePos({ x, y, type });
            } else {
              setShowHintPulse(true);
            }
          } else {
            setShowHintPulse(true);
          }
        }
      };

      const triggerSuccessOverlay = (title, explanation, nextStep) => {
        setCorrectPopup({ title, explanation, nextStep });
      };

      const advanceFromPopup = () => {
        if (correctPopup) {
          const next = correctPopup.nextStep;
          setCorrectPopup(null);
          setPulsePos(null);
          setShowHintPulse(false);
          setStep(next);
        }
      };

      return (
        <div className="relative min-h-screen bg-neutral-950">
          <button
            onClick={handleSkipDemo}
            className="absolute top-6 right-6 text-xs text-neutral-500 hover:text-neutral-200 border border-neutral-800 bg-neutral-900/60 px-3.5 py-1.5 rounded-full transition-colors z-50 lowercase tracking-wider"
          >
            skip demo
          </button>

          {step === 0 && (
            <div className="min-h-screen text-neutral-200 flex flex-col justify-center items-center font-sans lowercase p-6 animate-in fade-in">
              <h2 className="text-3xl font-light mb-4 text-white text-center">welcome to mushin.</h2>
              <p className="text-neutral-400 mb-8 text-center max-w-sm font-light">let's walk through how to create space between stimulus and response.</p>
              <button onClick={() => setStep(1)} className="px-8 py-3 border border-neutral-700 text-neutral-300 rounded-full text-sm hover:bg-neutral-800 transition-colors">begin demo</button>
            </div>
          )}

          {step === 1 && (
            <div className="relative min-h-screen">
              <div className="absolute inset-0 flex flex-col items-center justify-center z-40 pointer-events-none">
                <p className="bg-black/60 backdrop-blur px-6 py-3 rounded-full text-white text-sm animate-pulse mb-32 tracking-wider text-center max-w-[80%] border border-neutral-800">
                  first, tap the screen. watch the white invert to dark. take a deep breath.
                </p>
              </div>
              <SplashScreen onComplete={() => setStep(2)} />
            </div>
          )}

          {step === 2 && (
            <div className="min-h-screen text-neutral-200 p-6 flex flex-col justify-center items-center font-sans lowercase animate-in fade-in text-center">
              <div className="w-20 h-20 rounded-3xl bg-teal-950/40 border border-teal-800/50 text-teal-300 flex items-center justify-center mb-6 shadow-[0_0_25px_rgba(20,184,166,0.2)] animate-pulse">
                <Icons.Attachment />
              </div>
              <h3 className="text-2xl font-light text-white mb-2">poison 1: attachment</h3>
              <p className="text-neutral-400 text-sm max-w-sm font-light leading-relaxed mb-8">
                clinging, greed, or rigidity. it happens when you refuse to accept reality because you are attached to how things "should" be.
              </p>
              <button onClick={() => setStep(3)} className="px-8 py-3 bg-neutral-800 text-neutral-200 rounded-full text-sm hover:bg-neutral-700 transition-colors">next poison</button>
            </div>
          )}

          {step === 3 && (
            <div className="min-h-screen text-neutral-200 p-6 flex flex-col justify-center items-center font-sans lowercase animate-in fade-in text-center">
              <div className="w-20 h-20 rounded-3xl bg-rose-950/40 border border-rose-800/50 text-rose-300 flex items-center justify-center mb-6 shadow-[0_0_25px_rgba(244,63,94,0.2)] animate-pulse">
                <Icons.Aversion />
              </div>
              <h3 className="text-2xl font-light text-white mb-2">poison 2: aversion</h3>
              <p className="text-neutral-400 text-sm max-w-sm font-light leading-relaxed mb-8">
                anger, hatred, or resistance. it happens when you react forcefully to push away things, people, or feelings you dislike.
              </p>
              <button onClick={() => setStep(4)} className="px-8 py-3 bg-neutral-800 text-neutral-200 rounded-full text-sm hover:bg-neutral-700 transition-colors">next poison</button>
            </div>
          )}

          {step === 4 && (
            <div className="min-h-screen text-neutral-200 p-6 flex flex-col justify-center items-center font-sans lowercase animate-in fade-in text-center">
              <div className="w-20 h-20 rounded-3xl bg-indigo-950/40 border border-indigo-800/50 text-indigo-300 flex items-center justify-center mb-6 shadow-[0_0_25px_rgba(99,102,241,0.2)] animate-pulse">
                <Icons.Ignorance />
              </div>
              <h3 className="text-2xl font-light text-white mb-2">poison 3: ignorance</h3>
              <p className="text-neutral-400 text-sm max-w-sm font-light leading-relaxed mb-8">
                delusion or autopilot. it happens when you act mindlessly, make blind assumptions, or distract yourself to avoid truth.
              </p>
              <button onClick={() => setStep(5)} className="px-8 py-3 bg-teal-200 text-teal-950 rounded-full text-sm font-medium hover:bg-white transition-colors">practice scenarios</button>
            </div>
          )}

          {step >= 5 && step <= 9 && (
            <div className="min-h-screen text-neutral-200 p-6 flex flex-col font-sans lowercase items-center animate-in fade-in duration-500 select-none relative">
              <style>{`
                @keyframes ripple-burst {
                  0% { transform: scale(0) translate(-50%, -50%); opacity: 0.8; }
                  100% { transform: scale(30) translate(-50%, -50%); opacity: 0; }
                }
                .custom-ripple {
                  position: absolute;
                  width: 20px;
                  height: 20px;
                  border-radius: 50%;
                  background: rgba(255, 255, 255, 0.25);
                  animation: ripple-burst 0.7s ease-out forwards;
                  pointer-events: none;
                  transform-origin: 0 0;
                }
                @keyframes guide-pulse {
                  0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
                  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.4; }
                  100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
                }
                .hint-circle-pulse {
                  position: absolute;
                  width: 48px;
                  height: 48px;
                  border-radius: 50%;
                  border: 2px solid rgba(255, 255, 255, 0.8);
                  box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
                  animation: guide-pulse 1.2s ease-in-out infinite;
                  pointer-events: none;
                  z-index: 30;
                }
              `}</style>
              
              <div className="text-center mb-6 pt-4 max-w-sm h-36 flex flex-col justify-end">
                {step === 5 && (
                  <>
                    <p className="text-neutral-500 text-xs mb-2">scenario 1 of 4</p>
                    <p className="text-sm font-light text-white">you are stuck in traffic and raging because you 'should' be home by now.</p>
                    <p className="text-neutral-400 text-xs mt-2 font-medium">which poison is pulling you?</p>
                  </>
                )}
                {step === 6 && (
                  <>
                    <p className="text-neutral-500 text-xs mb-2">scenario 2 of 4</p>
                    <p className="text-sm font-light text-white">a coworker insults your work. you snap back with a hostile personal comment.</p>
                    <p className="text-neutral-400 text-xs mt-2 font-medium">which poison is pulling you?</p>
                  </>
                )}
                {step === 7 && (
                  <>
                    <p className="text-neutral-500 text-xs mb-2">scenario 3 of 4</p>
                    <p className="text-sm font-light text-white">you scroll on social media for 2 hours to avoid work, acting completely on autopilot.</p>
                    <p className="text-neutral-400 text-xs mt-2 font-medium">which poison is pulling you?</p>
                  </>
                )}
                {step === 8 && (
                  <>
                    <p className="text-neutral-500 text-xs mb-2">scenario 4 of 4</p>
                    <p className="text-sm font-light text-white">someone cuts you off. you feel a sharp spike of anger, but you take a breath, stay calm, and keep driving safely.</p>
                    <p className="text-neutral-400 text-xs mt-2 font-medium">what do you log?</p>
                  </>
                )}
                {step === 9 && (
                  <>
                    <p className="text-neutral-500 text-xs mb-2">severity mechanics</p>
                    <p className="text-sm font-light text-white">where you tap on a button logs severity. left = mild, right = severe.</p>
                    <p className="text-rose-400 text-xs mt-2 font-medium">tap the FAR RIGHT of aversion to log a severe reaction.</p>
                  </>
                )}
              </div>

              <div className="w-full max-w-md relative flex flex-col gap-4">
                <button onMouseDown={(e) => handlePoisonTap('attachment', e)} className="relative flex flex-col items-center justify-center p-6 rounded-3xl border border-teal-900/30 bg-teal-950/20 text-teal-200/70 overflow-hidden hover:bg-teal-950/30">
                  {showHintPulse && correctPoisonForStep === 'attachment' && (
                    <span className="hint-circle-pulse" style={{ left: '50%', top: '50%' }} />
                  )}
                  {pulsePos?.type === 'attachment' && <span className="custom-ripple" style={{ left: pulsePos.x, top: pulsePos.y }} />}
                  <Icons.Attachment />
                  <span className="mt-2 font-medium tracking-wide relative z-10 pointer-events-none">attachment</span>
                </button>

                <button onMouseDown={(e) => handlePoisonTap('aversion', e)} className="relative flex flex-col items-center justify-center p-6 rounded-3xl border border-rose-900/30 bg-rose-950/20 text-rose-200/70 overflow-hidden hover:bg-rose-950/30">
                  {showHintPulse && correctPoisonForStep === 'aversion' && (
                    <span className="hint-circle-pulse" style={{ left: step === 9 ? '85%' : '50%', top: '50%' }} />
                  )}
                  {pulsePos?.type === 'aversion' && <span className="custom-ripple" style={{ left: pulsePos.x, top: pulsePos.y }} />}
                  <Icons.Aversion />
                  <span className="mt-2 font-medium tracking-wide relative z-10 pointer-events-none">aversion</span>
                </button>

                <button onMouseDown={(e) => handlePoisonTap('ignorance', e)} className="relative flex flex-col items-center justify-center p-6 rounded-3xl border border-indigo-900/30 bg-indigo-950/20 text-indigo-200/70 overflow-hidden hover:bg-indigo-950/30">
                  {showHintPulse && correctPoisonForStep === 'ignorance' && (
                    <span className="hint-circle-pulse" style={{ left: '50%', top: '50%' }} />
                  )}
                  {pulsePos?.type === 'ignorance' && <span className="custom-ripple" style={{ left: pulsePos.x, top: pulsePos.y }} />}
                  <Icons.Ignorance />
                  <span className="mt-2 font-medium tracking-wide relative z-10 pointer-events-none">ignorance</span>
                </button>
              </div>

              {correctPopup && (
                <div className="fixed inset-0 bg-neutral-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-300">
                  <div className="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-700 text-neutral-200 flex items-center justify-center mb-6 shadow-lg">
                    <span className="text-xl">✓</span>
                  </div>
                  <h3 className="text-2xl font-light text-white mb-4 max-w-xs">{correctPopup.title}</h3>
                  <p className="text-neutral-400 text-sm max-w-sm font-light leading-relaxed mb-8">{correctPopup.explanation}</p>
                  <button onClick={advanceFromPopup} className="px-8 py-4 bg-neutral-200 text-neutral-900 rounded-full font-medium text-sm hover:bg-white transition-all shadow-lg">
                    continue
                  </button>
                </div>
              )}

              {showLessonOverlay && (
                <div className="fixed inset-0 bg-neutral-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-300">
                  <div className="w-16 h-16 rounded-full bg-neutral-900 border border-neutral-700 text-neutral-200 flex items-center justify-center mb-6">
                    <span className="text-2xl font-bold">!</span>
                  </div>
                  <h3 className="text-2xl font-light text-white mb-4 max-w-xs">NO! don't click.</h3>
                  <p className="text-neutral-400 text-sm max-w-sm font-light leading-relaxed mb-8">
                    being angry is ok as long as it didn't control your response. you felt the anger, maintained your space, and did not react out of a poison.
                  </p>
                  <button 
                    onClick={() => {
                      setShowLessonOverlay(false);
                      setShowHintPulse(false);
                      setStep(9);
                    }}
                    className="px-8 py-4 bg-gradient-to-r from-pink-100 via-purple-200 to-white text-purple-950 rounded-full font-medium text-sm hover:opacity-90 transition-all shadow-[0_0_20px_rgba(244,211,238,0.3)]"
                  >
                    i maintained my space (continue)
                  </button>
                </div>
              )}
            </div>
          )}

          {step === 10 && (
            <div className="min-h-screen text-neutral-200 p-6 flex flex-col justify-center items-center font-sans lowercase animate-in fade-in duration-500">
              <div className="max-w-md mx-auto w-full text-center">
                <div className="w-16 h-16 bg-neutral-900 rounded-full flex items-center justify-center mx-auto mb-6">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-neutral-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <h2 className="text-2xl font-light mb-4 text-white">time is logged.</h2>
                <p className="text-neutral-400 font-light mb-12 leading-relaxed text-sm">
                  the exact time of your tap is recorded. reacting rapidly in a spiral lowers your score. maintaining space and calm between stressors raises it.
                </p>
                <button onClick={handleSkipDemo} className="w-full py-4 rounded-xl bg-neutral-200 text-neutral-900 font-medium tracking-wide hover:bg-white transition-colors shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                  i am ready
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- FAQ & ABOUT SCREEN ---
    function FaqScreen({ onBack, onOpenTutorial }) {
      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-200 p-6 flex flex-col font-sans lowercase animate-in fade-in duration-500">
          <div className="flex items-center mb-8 pt-4">
            <button onClick={onBack} className="text-neutral-500 hover:text-neutral-300 mr-4">
              <Icons.ArrowLeft />
            </button>
            <h2 className="text-xl font-light tracking-wide text-neutral-400">about & faq</h2>
          </div>

          <div className="flex-1 max-w-md mx-auto w-full space-y-8 overflow-y-auto pb-10 scrollbar-none">
            <section>
              <h3 className="text-white font-medium mb-3">what is the inspiration behind this?</h3>
              <p className="text-sm text-neutral-400 font-light leading-relaxed mb-4">
                this app is a digital tool built on core philosophies and visual motifs:
              </p>
              <ul className="space-y-4 text-sm text-neutral-400 font-light">
                <li className="bg-neutral-900/40 p-4 rounded-xl border border-neutral-800/50">
                  <strong className="text-neutral-200 font-medium block mb-1">mushin (zen buddhism)</strong>
                  "no-mind". the practice of letting go of your internal narrative to be purely present, unstuck from your anger.
                </li>
                <li className="bg-neutral-900/40 p-4 rounded-xl border border-neutral-800/50">
                  <strong className="text-neutral-200 font-medium block mb-1">the 3 poisons (buddhism)</strong>
                  the belief that all suffering comes from attachment (clinging), aversion (anger), or ignorance (autopilot).
                </li>
                <li className="bg-neutral-900/40 p-4 rounded-xl border border-neutral-800/50">
                  <strong className="text-neutral-200 font-medium block mb-1">the space between (existentialism)</strong>
                  "between stimulus and response there is a space..." <span className="text-xs text-neutral-500 italic block mt-1">Note: While often attributed to Viktor Frankl, this phrasing is a synthesis popularized by Stephen Covey and Rollo May inspired by Frankl's logotherapy.</span>
                </li>
                <li className="bg-neutral-900/40 p-4 rounded-xl border border-neutral-800/50">
                  <strong className="text-neutral-200 font-medium block mb-1">visual inspiration (bleach)</strong>
                  the falling petals and expanding space effect is inspired by senbonzakura kageyoshi.
                </li>
              </ul>
            </section>

            <section>
              <h3 className="text-white font-medium mb-3">how does the score work?</h3>
              <p className="text-sm text-neutral-400 font-light leading-relaxed">
                your end-of-day mindfulness score (1 to 5) is calculated automatically. it factors in three things: the total number of reactions you had, the severity of those reactions (tapping the right side vs left side), and the time gap between them. reacting multiple times in a quick downward spiral lowers your score, while maintaining space and calm between stressors raises it.
              </p>
            </section>

            <button 
              onClick={onOpenTutorial}
              className="w-full py-4 mt-8 rounded-xl border border-neutral-800 text-neutral-400 hover:text-white hover:bg-neutral-900 transition-colors text-sm font-medium tracking-wide"
            >
              view tutorial again
            </button>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
